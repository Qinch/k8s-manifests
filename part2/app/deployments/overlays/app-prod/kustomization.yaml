apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod


resources:
- ../../base
- ./ns.yaml

patches:
- path: ./container_env.yaml
  target:
    kind: Deployment
- path: ./container_probe.yaml
  target:
    kind: Deployment
- path: ./container_lifecycle.yaml
  target:
    kind: Deployment
images:
- name: mock-conf-image
  newName: qinchaowhut/app-conf
  newTag: v0.1.1
- name: mock-image
  newName: qinchaowhut/app
  newTag: v0.1.1
